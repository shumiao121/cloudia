<!doctype html><meta charset="utf-8"><title>probe</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
} }
</script>
<pre id="out">…</pre>
<script type="module">
// 本机排查用：只加载一个 spz，报加载是否完成、花多久、多少个点
import * as THREE from 'three';
import { SplatMesh, PackedSplats } from '@sparkjsdev/spark';
const f = new URLSearchParams(location.search).get('f');
const out = document.getElementById('out'), t = performance.now();
window.__probe = { state: 'loading' };
const errs = []; addEventListener('error', e => errs.push(String(e.message))); addEventListener('unhandledrejection', e => errs.push(String(e.reason)));
try {
  const m = new SplatMesh({ url: new URL(f, location.href).href });
  await Promise.race([m.initialized, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout 20s')), 20000))]);
  window.__probe = { state: 'ok', ms: Math.round(performance.now() - t), n: m.packedSplats?.numSplats ?? m.numSplats };
} catch (e) { window.__probe = { state: 'fail', err: String(e), ms: Math.round(performance.now() - t), errs }; }
out.textContent = JSON.stringify(window.__probe);
</script>
