<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mirror sky · world test</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #10141a; color: #eef; font: 14px -apple-system, system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100dvh; touch-action: none; }
  .bar { position: fixed; left: 0; right: 0; top: 0; padding: max(8px, env(safe-area-inset-top)) 10px 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    background: linear-gradient(rgba(10, 14, 20, .75), rgba(10, 14, 20, 0)); }
  button { font: inherit; border: 1px solid rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .1); color: #fff; border-radius: 999px; padding: 7px 12px; }
  button[aria-pressed=true] { background: #fff; color: #10141a; }
  .info { position: fixed; left: 10px; bottom: max(10px, env(safe-area-inset-bottom)); background: rgba(10, 14, 20, .6); padding: 6px 10px; border-radius: 10px; font-size: 12px; line-height: 1.5; }
  .hint { position: fixed; right: 10px; bottom: max(10px, env(safe-area-inset-bottom)); font-size: 12px; opacity: .75; text-align: right; }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="info" id="info">Loading…</div>
<div class="hint">Drag to look around<br>Pinch / scroll to move</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
} }
</script>
<script type="module">
// 测试页（11-18）：World Labs 生成的「天空之镜」草稿，几个随机种子并排挑。只给我们自己看，noindex。
import * as THREE from 'three';
import { SparkRenderer, SplatMesh } from '@sparkjsdev/spark';

const WORLDS = await (await fetch('worlds.json', { cache: 'no-store' })).json();   // [{name, file, mb}]
const params = new URLSearchParams(location.search);
let res = params.get('res') || (matchMedia('(pointer: coarse)').matches ? '100k' : '500k');

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#cfd8ea');
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 1000);
scene.add(new SparkRenderer({ renderer }));
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

// 看：拖动转头；捏合 / 滚轮往前后走
let yaw = 0, pitch = 0, pos = new THREE.Vector3(0, 0, 0), flip = true;
const pts = new Map(); let pinch = 0;
const el = renderer.domElement;
el.onpointerdown = e => { el.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); };
el.onpointermove = e => {
  const p = pts.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p[0], dy = e.clientY - p[1]; p[0] = e.clientX; p[1] = e.clientY;
  if (pts.size === 1) { yaw += dx * 0.004; pitch = Math.max(-1.4, Math.min(1.4, pitch + dy * 0.004)); }
  else if (pts.size === 2) { const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) walk((d - pinch) * 0.01); pinch = d; }
};
const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = 0; };
el.onpointerup = up; el.onpointercancel = up;
el.onwheel = e => { e.preventDefault(); walk(-e.deltaY * 0.004); };
function walk(d) { const f = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)); pos.addScaledVector(f, d); pos.clampLength(0, 6); }

let mesh = null, cur = null, t0 = 0;
async function show(w) {
  cur = w; for (const b of bar.querySelectorAll('[data-w]')) b.setAttribute('aria-pressed', String(b.dataset.w === w.name));
  if (mesh) { scene.remove(mesh); mesh.dispose?.(); mesh = null; }
  info.textContent = `Loading ${w.name} (${res})…`; t0 = performance.now();
  const url = `${w.name}/${res}.spz`;
  mesh = new SplatMesh({ url });
  if (flip) mesh.quaternion.set(1, 0, 0, 0);   // World Labs 的 splat 是 y 朝下，翻过来
  scene.add(mesh);
  await mesh.initialized;
  const mb = (w.mb && w.mb[res]) ? `${w.mb[res]} MB` : '';
  info.dataset.base = `${w.name} · ${res} ${mb} · loaded in ${((performance.now() - t0) / 1000).toFixed(1)}s`;
}
const bar = document.getElementById('bar'), info = document.getElementById('info');
for (const w of WORLDS) { const b = document.createElement('button'); b.dataset.w = w.name; b.textContent = w.label || w.name; b.onclick = () => show(w); bar.appendChild(b); }
const rb = document.createElement('button'); rb.textContent = 'Res: ' + res; rb.onclick = () => { res = res === '100k' ? '500k' : '100k'; rb.textContent = 'Res: ' + res; show(cur); }; bar.appendChild(rb);
const fb = document.createElement('button'); fb.textContent = 'Flip'; fb.onclick = () => { flip = !flip; if (mesh) mesh.quaternion.set(flip ? 1 : 0, 0, 0, flip ? 0 : 1); }; bar.appendChild(fb);
const ib = document.createElement('button'); ib.textContent = 'Reset'; ib.onclick = () => { yaw = pitch = 0; pos.set(0, 0, 0); }; bar.appendChild(ib);

// 帧率
let frames = 0, last = performance.now(), fps = 0;
renderer.setAnimationLoop(() => {
  camera.position.copy(pos);
  camera.quaternion.setFromEuler(new THREE.Euler(-pitch, -yaw, 0, 'YXZ'));
  renderer.render(scene, camera);
  frames++; const now = performance.now();
  if (now - last > 1000) { fps = Math.round(frames * 1000 / (now - last)); frames = 0; last = now; if (info.dataset.base) info.textContent = `${info.dataset.base} · ${fps} fps`; }
});
show(WORLDS[0]);
</script>
</body>
</html>
