<!--
  11-21 他要「用户点 getcloudia.com 进入就是英文首页」：根目录直接转到画画页 today/（支持页挪到 support/）。
  帖子里只写 getcloudia.com、不带 ?s=：从哪个网站点进来的，在这里按来源记成 ?s=（跳转以后来源就丢了），
  画画页把它带进统计和商店链接的 ct。
-->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  if (!q.has('s')) {
    var h = ''; try { h = new URL(document.referrer).hostname; } catch (e) {}
    var s = /(^|\.)threads\.(net|com)$/.test(h) ? 'threads' : /(^|\.)instagram\.com$/.test(h) ? 'ig'
      : /(^|\.)(facebook\.com|fb\.me)$/.test(h) ? 'fb' : /(^|\.)reddit\.com$/.test(h) ? 'reddit'
      : /(^|\.)(t\.co|x\.com|twitter\.com)$/.test(h) ? 'x' : /(^|\.)news\.ycombinator\.com$/.test(h) ? 'hn' : '';
    if (s) q.set('s', s);
  }
  var qs = q.toString();
  location.replace('today/' + (qs ? '?' + qs : '') + location.hash);
})();
</script>
